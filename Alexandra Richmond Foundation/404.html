  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;width:100%}
  a:focus-visible{outline:2.5px solid var(--peri-deep);outline-offset:3px;border-radius:6px}
  header{border-bottom:1px solid var(--line);background:rgba(247,244,238,.92)}
  nav{display:flex;align-items:center;height:78px}
  .brand-logo{height:50px;width:auto;display:block}
  .nf{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 0;position:relative;overflow:hidden}
  .nf::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 80% 8%,rgba(166,140,212,.26),transparent 52%),radial-gradient(circle at 6% 96%,rgba(106,79,168,.13),transparent 48%)}
  .nf .inner{position:relative;z-index:1;max-width:520px}
  .nf .code{font-family:var(--serif);font-weight:600;font-size:clamp(4rem,9vw,6.5rem);color:var(--peri-deep);line-height:1}
  .nf h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.08;letter-spacing:-.02em;margin-top:8px}
  .nf p{font-size:1.1rem;color:var(--ink-soft);margin:18px auto 34px;max-width:42ch}
  .btn-primary{display:inline-flex;align-items:center;gap:9px;background:var(--indigo);color:var(--cream);padding:16px 32px;border-radius:var(--r-pill);font-weight:700;font-size:1rem;box-shadow:var(--sh-btn);transition:background .25s,transform .25s var(--ease)}
  .btn-primary:hover{background:var(--peri-deep);transform:translateY(-2px)}
  footer{background:var(--indigo-deep);color:rgba(247,244,238,.6);padding:34px 0;text-align:center;font-size:.84rem}
  @media(max-width:520px){.wrap{padding:0 20px}.nf{padding:56px 0}}
</style>
<script defer src="/analytics.js"></script>
